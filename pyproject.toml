[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seisvel"
version = "0.1.0"
description = "Velocity analysis, automatic/AI velocity picking, NMO correction and stacking for prestack seismic data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.58", "matplotlib>=3.7", "segyio>=1.9"]

[project.optional-dependencies]
ai = ["torch>=2.1"]
dev = ["pytest"]

[project.scripts]
seisvel = "seisvel.cli:main"

[tool.setuptools.packages.find]
include = ["seisvel*"]
